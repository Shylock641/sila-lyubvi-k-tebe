
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090611">
<title>Сила любви к тебе ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: #090611;
  color: white;
  font-family: Georgia, serif;
}

/* SPACE */

.space {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%,
      #30102f, #170b25 55%, #080610);
}

/* NEBULA CLOUDS */

.cloud {
  position: absolute;
  width: 110vw;
  height: 110vw;
  max-width: 1000px;
  max-height: 1000px;
  border-radius: 50%;
  filter: blur(48px);
  will-change: transform;
  animation: drift 28s ease-in-out infinite alternate;
}

.cloud1 {
  left: -35%;
  top: -30%;
  opacity: .65;
  background:
    radial-gradient(ellipse at 40% 40%,
      #ff4d9e 0%,
      #bd348e 22%,
      #70277e 43%,
      transparent 70%);
}

.cloud2 {
  right: -45%;
  bottom: -35%;
  opacity: .55;
  animation-delay: -12s;
  animation-duration: 35s;
  background:
    radial-gradient(ellipse at 50% 50%,
      #ed65c0 0%,
      #9838ad 30%,
      #47236e 55%,
      transparent 72%);
}

.cloud3 {
  top: 20%;
  left: 15%;
  opacity: .35;
  animation-delay: -7s;
  animation-duration: 31s;
  background:
    radial-gradient(ellipse at 50% 50%,
      #ff9bdc 0%,
      #a64cba 30%,
      transparent 70%);
}

.cloud4 {
  width: 75vw;
  height: 75vw;
  right: 5%;
  top: 5%;
  opacity: .28;
  filter: blur(60px);
  animation-delay: -17s;
  background:
    radial-gradient(ellipse,
      #e93c9b, #6730a0 40%, transparent 72%);
}

@keyframes drift {
  from {
    transform: translate(-5%, -4%) scale(.9) rotate(0deg);
  }
  to {
    transform: translate(8%, 7%) scale(1.18) rotate(12deg);
  }
}


/* HEART NEBULA STRUCTURE */

.heart-nebula {
  position: absolute;
  width: min(85vw, 420px);
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  opacity: .48;
  filter: blur(15px);
  pointer-events: none;
  animation: nebulaPulse 12s ease-in-out infinite alternate;
}

.heart-nebula::before {
  content: "";
  position: absolute;
  inset: 8%;
  background:
    radial-gradient(ellipse at 50% 40%,
      rgba(255,190,239,.8),
      rgba(255,70,170,.48) 25%,
      rgba(153,48,180,.3) 48%,
      transparent 72%);
  clip-path: polygon(
    50% 92%,
    8% 48%,
    3% 32%,
    10% 15%,
    25% 8%,
    50% 30%,
    75% 8%,
    90% 15%,
    97% 32%,
    92% 48%
  );
  filter: drop-shadow(0 0 25px #f45bc5);
}

.heart-nebula::after {
  content: "";
  position: absolute;
  inset: 20%;
  border-radius: 50%;
  background:
    radial-gradient(ellipse,
      rgba(255,180,235,.35),
      rgba(213,75,190,.18) 40%,
      transparent 72%);
  filter: blur(22px);
}

@keyframes nebulaPulse {
  from {
    opacity: .28;
    scale: .94;
  }
  to {
    opacity: .58;
    scale: 1.07;
  }
                    }
  /* STARS AND DUST */

#stars {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#dust {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* COMETS */

.comet {
  position: absolute;
  width: 10px;
  height: 10px;
  pointer-events: none;
  animation: fly 7s linear forwards;
  z-index: 3;
}

.comet-head {
  position: absolute;
  right: 0;
  top: 0;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 12px 5px #ff91db;
}

.comet-tail {
  position: absolute;
  right: 5px;
  top: 3px;
  width: 150px;
  height: 3px;
  background: linear-gradient(
    to left,
    white,
    #ff7acb,
    #a53dcb,
    transparent
  );
  box-shadow: 0 0 12px #eb8bff;
}

.comet-message {
  position: absolute;
  right: -10px;
  bottom: 25px;
  width: max-content;
  max-width: 210px;
  text-align: right;
  white-space: normal;
  font-size: 14px;
  line-height: 1.5;
  color: #ffe3f7;
  text-shadow: 0 0 12px #ff5bcf;
}

@keyframes fly {
  0% {
    transform: translate(0, 0);
    opacity: 0;
  }
  12% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    transform: translate(var(--dx), var(--dy));
    opacity: 0;
  }
}

/* MAIN TEXT */

.intro {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  pointer-events: none;
}

h1 {
  font-size: clamp(34px, 8vw, 58px);
  font-weight: normal;
  color: #ffe0fa;
  text-shadow:
    0 0 15px #ff63cf,
    0 0 35px #b33ac0,
    0 0 65px #8b35c0;
  animation: glow 4s ease-in-out infinite alternate;
}

.subtitle {
  margin-top: 24px;
  max-width: 350px;
  font-size: 17px;
  line-height: 1.9;
  color: #f0d5f5;
  text-shadow: 0 0 12px #b64cba;
}

@keyframes glow {
  from { opacity: .8; }
  to { opacity: 1; }
}

/* MOBILE PERFORMANCE */

@media (max-width: 600px) {
  .cloud {
    filter: blur(40px);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div class="space">

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="cloud cloud4"></div>
  <div class="heart-nebula"></div>

  <canvas id="stars"></canvas>
  <canvas id="dust"></canvas>

  <div id="comets"></div>

</div>

<main class="intro">
  <h1>Сила любви к тебе</h1>

  <p class="subtitle">
    Среди бесконечности звёзд<br>
    есть только одна,<br>
    которая освещает мой мир.<br>
    ❤️
  </p>
</main>

<script>

/* SETTINGS */

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

/* STAR FIELD */

const starsCanvas = document.getElementById("stars");
const starsCtx = starsCanvas.getContext("2d");

let stars = [];

function resizeCanvas(canvas, ctx) {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);

  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createStars() {
  stars = Array.from(
    { length: Math.min(170, Math.floor(innerWidth / 2.5)) },
    () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      size: Math.random() * 1.7 + .3,
      phase: Math.random() * Math.PI * 2
    })
  );
}

function drawStars(time = 0) {
  starsCtx.clearRect(0, 0, innerWidth, innerHeight);

  stars.forEach(star => {
    const opacity = .3 +
      Math.sin(time * .001 + star.phase) * .3;

    starsCtx.beginPath();
    starsCtx.arc(
      star.x, star.y, star.size, 0, Math.PI * 2
    );

    starsCtx.fillStyle =
      `rgba(255,225,255,${opacity})`;

    starsCtx.fill();
  });

  if (!reducedMotion) {
    requestAnimationFrame(drawStars);
  }
}

/* COSMIC DUST */

const dustCanvas = document.getElementById("dust");
const dustCtx = dustCanvas.getContext("2d");

let particles = [];

function createDust() {
  particles = Array.from({ length: 35 }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    size: Math.random() * 1.5 + .4,
    speed: Math.random() * .25 + .08,
    opacity: Math.random() * .5 + .2
  }));
}

function drawDust() {
  dustCtx.clearRect(0, 0, innerWidth, innerHeight);

  particles.forEach(p => {
    dustCtx.beginPath();
    dustCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

    dustCtx.fillStyle =
      `rgba(255,180,230,${p.opacity})`;

    dustCtx.fill();

    p.y -= p.speed;

    if (p.y < -5) {
      p.y = innerHeight + 5;
      p.x = Math.random() * innerWidth;
    }
  });

  if (!reducedMotion) {
    requestAnimationFrame(drawDust);
  }
}

function resize() {
  resizeCanvas(starsCanvas, starsCtx);
  resizeCanvas(dustCanvas, dustCtx);

  createStars();
  createDust();

  if (reducedMotion) {
    drawStars(0);
    drawDust();
  }
}

resize();
drawStars();
drawDust();

window.addEventListener("resize", resize);

/* ROMANTIC COMETS */

const messages = [
  "Ты моё самое красивое совпадение ❤️",
  "Даже среди бесконечности я выбрал бы тебя",
  "Ты делаешь мой мир светлее ✨",
  "Моя любимая звезда 🌙",
  "Расстояние не меняет моих чувств",
  "Ты особенная часть моей вселенной",
  "Моё сердце всегда находит дорогу к тебе",
  "В моей вселенной есть только одна ты"
];

function createComet() {
  if (reducedMotion || document.hidden) return;

  const comet = document.createElement("div");
  comet.className = "comet";

  const head = document.createElement("div");
  head.className = "comet-head";

  const tail = document.createElement("div");
  tail.className = "comet-tail";

  const message = document.createElement("div");
  message.className = "comet-message";

  message.textContent =
    messages[Math.floor(Math.random() * messages.length)];

  comet.append(tail, head, message);

  const startX = Math.random() * innerWidth * .45;
  const startY = Math.random() * innerHeight * .7;

  const dx = innerWidth + 250;
  const dy = (Math.random() - .5) * innerHeight * .5;

  comet.style.left = startX + "px";
  comet.style.top = startY + "px";

  comet.style.setProperty("--dx", dx + "px");
  comet.style.setProperty("--dy", dy + "px");

  const angle = Math.atan2(dy, dx) * 180 / Math.PI;

  tail.style.transform = `rotate(${angle + 180}deg)`;

  document.getElementById("comets").appendChild(comet);

  setTimeout(() => comet.remove(), 7100);
}

if (!reducedMotion) {
  setTimeout(createComet, 2000);

  setInterval(() => {
    if (!document.hidden) createComet();
  }, 7500);
}

</script>

</body>
</html>
